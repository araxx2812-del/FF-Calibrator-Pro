<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<title>FF Calibrator Pro</title>
<style>
:root{--bg:#050817;--card:#0b1124;--line:#26345d;--text:#f7f8ff;--muted:#a8b0c9;--purple:#8b35ff;--blue:#159cff;--green:#16d97b;--yellow:#ffc928;--red:#ef334c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#29104d 0,#090d1d 35%,#040610 80%);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:auto;padding:18px 14px 34px}
header{text-align:center;padding:6px 0 18px;position:relative}
.logo{font-size:30px;font-weight:900;letter-spacing:.5px}.logo span:first-child{color:#fff}.logo span:nth-child(2){color:var(--purple)}.logo span:last-child{color:var(--blue)}
.sub{color:#9ca6c2;font-size:15px;margin-top:4px}
.card{background:linear-gradient(145deg,#0c1228,#080c1b);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:12px;box-shadow:0 12px 35px #0007}
.label{font-weight:900;font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:9px}.label small{color:var(--muted);font-weight:500;margin-left:auto}
select,input{width:100%;border:1px solid #354570;background:#131c38;color:#fff;border-radius:14px;padding:15px;font-size:16px;outline:none}
select:focus,input:focus{border-color:#9b5cff;box-shadow:0 0 0 3px #8b35ff22}
.search{position:relative}.search input{padding-left:45px}.searchIcon{position:absolute;left:15px;top:13px;font-size:21px;color:#9ca6c2}
.results{display:none;position:absolute;z-index:10;left:0;right:0;top:58px;background:#0b1020;border:1px solid #384b7d;border-radius:14px;overflow:hidden;box-shadow:0 18px 40px #000b}.results.show{display:block}
.result{width:100%;background:none;border:0;border-bottom:1px solid #202c4d;color:#fff;text-align:left;padding:12px 14px;cursor:pointer}.result:last-child{border:0}.result b{display:block}.result span{color:var(--muted);font-size:12px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.level{border:1px solid #33415f;background:#0b1020;border-radius:15px;padding:15px 8px;font-weight:900;color:#dce2f5;font-size:16px;cursor:pointer}.level.low.active{background:#0b5d38;border-color:#18e681;box-shadow:0 0 18px #18e68155}.level.med.active{background:#765900;border-color:#ffd52c;box-shadow:0 0 18px #ffd52c55}.level.high.active{background:#7d1528;border-color:#ff3b58;box-shadow:0 0 18px #ff3b5855}
.resultCard{border:1px solid #703cff;background:linear-gradient(145deg,#0e1530,#090b1b);padding:16px;border-radius:20px;margin-top:12px}.resultTitle{font-size:20px;font-weight:900;margin-bottom:10px}.resultTitle span{color:#a866ff}
.row{display:grid;grid-template-columns:1fr 88px;align-items:center;border-bottom:1px solid #202c4d;padding:12px 2px}.row:last-child{border:0}.name{font-weight:800}.val{text-align:center;background:#151033;border:1px solid #6532be;color:#cdaaff;border-radius:9px;padding:8px;font-weight:900;font-size:20px}.bar{height:5px;background:#17223e;border-radius:10px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7d31ff,#1aa8ff);border-radius:10px}
.dpiRow{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center}.hint{color:var(--muted);font-size:12px;margin-top:8px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.btn{border:0;border-radius:15px;padding:15px 10px;font-weight:900;font-size:14px;color:white;cursor:pointer}.primary{background:linear-gradient(135deg,#7e28ff,#a044ff);box-shadow:0 8px 22px #7e28ff44}.secondary{background:linear-gradient(135deg,#078dff,#1762ff);box-shadow:0 8px 22px #087fff33}.copy{width:100%;margin-top:10px;background:#0b1530;border:1px solid #258cff}
.selected{color:#8fb6ff;font-size:12px;margin-top:8px;min-height:15px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#10182d;border:1px solid #48639d;padding:11px 15px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:480px){.wrap{padding:12px 10px 28px}.logo{font-size:25px}.card{padding:15px;border-radius:19px}.row{grid-template-columns:1fr 78px}.val{font-size:18px}.dpiRow{grid-template-columns:1fr 125px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo"><span>FF </span><span>CALIBRATOR</span> <span>PRO</span></div>
  <div class="sub">Generador rápido de sensibilidad</div>
</header>

<section class="card">
  <div class="label">📱 SELECCIONA TU MARCA</div>
  <select id="brand"><option value="">Selecciona una marca</option></select>
</section>

<section class="card">
  <div class="label">🔎 BUSCA TU MODELO</div>
  <div class="search">
    <span class="searchIcon">⌕</span>
    <input id="model" placeholder="Ej: S23 Ultra, A54, Redmi Note 13..." autocomplete="off">
    <div class="results" id="results"></div>
  </div>
  <div class="selected" id="selected"></div>
</section>

<section class="card">
  <div class="label">🎮 NIVEL DE SENSIBILIDAD</div>
  <div class="levels">
    <button class="level low" data-level="low">BAJA</button>
    <button class="level med active" data-level="medium">MEDIA</button>
    <button class="level high" data-level="high">ALTA</button>
  </div>
</section>

<section class="resultCard">
  <div class="resultTitle">📄 CONFIGURACIÓN <span>GENERADA</span></div>
  <div id="output"></div>
</section>

<section class="card">
  <div class="label">⚙️ DPI <small>OPCIONAL</small></div>
  <div class="dpiRow">
    <input id="dpi" type="number" min="300" max="800" value="550">
    <button class="btn secondary" id="autoDpi">DPI RECOMENDADO</button>
  </div>
  <div class="hint" id="dpiHint">Selecciona tu modelo para obtener una recomendación.</div>
</section>

<div class="actions">
  <button class="btn primary" id="withDpi">⚡ GENERAR CON DPI</button>
  <button class="btn secondary" id="withoutDpi">🔄 GENERAR SIN DPI</button>
</div>
<button class="btn copy" id="copy">📋 COPIAR CONFIGURACIÓN</button>
</div>

<div class="toast" id="toast"></div>

<script>
const phones=[
["Samsung","S23 Ultra","1440×3088","120 Hz",550],["Samsung","S24 Ultra","1440×3120","120 Hz",550],["Samsung","S24","1080×2340","120 Hz",520],["Samsung","S23","1080×2340","120 Hz",520],["Samsung","A55 5G","1080×2340","120 Hz",500],["Samsung","A54 5G","1080×2340","120 Hz",500],["Samsung","A35 5G","1080×2340","120 Hz",500],["Samsung","A25 5G","1080×2340","120 Hz",480],["Samsung","A15 5G","1080×2340","90 Hz",450],
["Xiaomi","Redmi Note 13","1080×2400","120 Hz",500],["Xiaomi","Redmi Note 13 Pro","1220×2712","120 Hz",520],["Xiaomi","Redmi Note 13 Pro+ 5G","1220×2712","120 Hz",550],["Xiaomi","Redmi Note 12","1080×2400","120 Hz",500],["Xiaomi","Redmi Note 14","1080×2400","120 Hz",520],["Xiaomi","POCO X6 Pro 5G","1220×2712","120 Hz",550],["Xiaomi","POCO X7 Pro","1220×2712","120 Hz",550],["Xiaomi","Xiaomi 14T","1220×2712","144 Hz",550],
["realme","C55","1080×2400","90 Hz",480],["realme","C67","1080×2400","90 Hz",480],["realme","12 Pro+ 5G","1080×2412","120 Hz",520],
["Motorola","Moto G54 5G","1080×2400","120 Hz",500],["Motorola","Moto G84 5G","1080×2400","120 Hz",500],["Motorola","Edge 50 Fusion","1080×2400","120 Hz",520],
["HONOR","X8b","1080×2412","90 Hz",480],["HONOR","X9b 5G","1200×2652","120 Hz",520],
["OPPO","A58","1080×2400","90 Hz",480],["OPPO","Reno 11 5G","1080×2412","120 Hz",520],
["vivo","Y36","1080×2388","90 Hz",480],["vivo","V30","1260×2800","120 Hz",520],
["Tecno","Spark 20 Pro","1080×2460","120 Hz",500],["Tecno","Camon 30","1080×2436","120 Hz",500],
["Infinix","Hot 40 Pro","1080×2460","120 Hz",500],["Infinix","Note 40 Pro","1080×2436","120 Hz",520],
["Apple","iPhone 11","828×1792","60 Hz",420],["Apple","iPhone 12","1170×2532","60 Hz",450],["Apple","iPhone 13","1170×2532","60 Hz",450],["Apple","iPhone 14 Pro","1179×2556","120 Hz",480]
];

const brand=$("brand"),model=$("model"),results=$("results"),dpi=$("dpi"),output=$("output");
let selected=null,level="medium";

[...new Set(phones.map(p=>p[0]))].sort().forEach(b=>brand.insertAdjacentHTML("beforeend",`<option>${b}</option>`));

brand.addEventListener("change",()=>{
  model.value=""; selected=null; $("selected").textContent="";
  results.classList.remove("show");
  if(brand.value) showResults("");
  generate(false);
});

function showResults(q){
  const query=(q||"").trim().toLowerCase(), b=brand.value;
  let list=phones.filter(p=>(!b||p[0]===b)&&((p[1]).toLowerCase().includes(query)||p[0].toLowerCase().includes(query))).slice(0,9);
  if(!list.length){results.innerHTML='<div class="result"><b>No encontrado</b><span>Prueba otro modelo.</span></div>';results.classList.add("show");return}
  results.innerHTML=list.map(p=>`<button class="result" data-id="${phones.indexOf(p)}"><b>${p[0]} ${p[1]}</b><span>${p[2]} · ${p[3]} · DPI ${p[4]}</span></button>`).join("");
  results.querySelectorAll("[data-id]").forEach(btn=>btn.onclick=()=>choose(phones[+btn.dataset.id]));
  results.classList.add("show");
}
model.addEventListener("input",()=>showResults(model.value));
model.addEventListener("focus",()=>showResults(model.value));
document.addEventListener("click",e=>{if(!e.target.closest(".search"))results.classList.remove("show")});

function choose(p){
 selected=p; brand.value=p[0]; model.value=p[1];
 $("selected").textContent=`✓ ${p[0]} ${p[1]} · ${p[2]} · ${p[3]}`;
 dpi.value=p[4]; $("dpiHint").textContent=`DPI recomendado para este modelo: ${p[4]}`;
 results.classList.remove("show"); generate(false); toast("Modelo seleccionado");
}
document.querySelectorAll(".level").forEach(btn=>btn.onclick=()=>{
 document.querySelectorAll(".level").forEach(x=>x.classList.remove("active"));btn.classList.add("active");
 level=btn.dataset.level;generate(false);
});

function clamp(n){return Math.max(0,Math.min(200,Math.round(n)))}
function generate(useDpi){
 let base=selected?92:88;
 const levelAdj={low:-12,medium:0,high:12}[level];
 base+=levelAdj;
 if(selected) base+=(selected[4]-500)/25;
 if(useDpi) base+=(+dpi.value-500)/20;
 const r={
  "GENERAL":clamp(base+12),
  "PUNTO ROJO":clamp(base-8),
  "MIRA 2X":clamp(base+6),
  "MIRA 4X":clamp(base+18),
  "AWM":clamp(base-32),
  "BOTÓN DISPARO":clamp(base-22)
 };
 output.innerHTML=Object.entries(r).map(([k,v])=>`<div class="row"><div><div class="name">${k}</div><div class="bar"><i style="width:${Math.min(100,v/2)}%"></i></div></div><div class="val">${v}%</div></div>`).join("");
 window.current={...r,useDpi,dpi:+dpi.value};
}
$("withDpi").onclick=()=>{generate(true);toast("Configuración generada con DPI")};
$("withoutDpi").onclick=()=>{generate(false);toast("Configuración generada sin DPI")};
$("autoDpi").onclick=()=>{if(selected)dpi.value=selected[4];toast(selected?"DPI recomendado aplicado":"Primero selecciona un modelo");generate(!!selected)};
$("copy").onclick=async()=>{
 if(!window.current)generate(false);
 const phone=selected?`${selected[0]} ${selected[1]}`:"Sin modelo";
 const txt=`FF CALIBRATOR PRO
Teléfono: ${phone}
Nivel: ${level.toUpperCase()}
${Object.entries(window.current).filter(([k])=>!["useDpi","dpi"].includes(k)).map(([k,v])=>`${k}: ${v}%`).join("\n")}
DPI: ${window.current.useDpi?window.current.dpi:"No usado"}`;
 try{await navigator.clipboard.writeText(txt);toast("Configuración copiada")}catch{toast("No se pudo copiar automáticamente")}
};
function toast(t){const x=$("toast");x.textContent=t;x.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove("show"),1700)}
generate(false);
</script>
</body>
</html>
